# ===========================================================================
# y52s (V2057A / PD2057) - build TWRP with FBE decryption on GitHub Actions.
#
# WHY A CLOUD BUILD:
#   The local Windows host has no usable Linux: wsl.exe is blocked by security
#   policy, Docker daemon is down, the VMware Ubuntu VM has no guest creds,
#   and the link cannot sustain a 40-60 GB `repo sync`. GitHub's runner does
#   the syncing instead; this machine only pushes ~25 MB and pulls back one
#   ~40-100 MB recovery.img.
#
# WHY twrp-11 (NOT twrp-12.1):
#   This device is Android 10. Its FBE stack is the old android.security.keystore
#   + HIDL keymaster@4.0 / gatekeeper@1.0. TeamWin android-11 crypto/fscrypt/
#   Decrypt.cpp uses exactly that API and has NO keystore2 reference. We already
#   proved (locally, v10) that a 12.1 TWRP binary hangs forever at
#   "Attempting to initialize DEKeys" because this device has no
#   android.system.keystore2.IKeystoreService/default. DO NOT change the branch.
#
# RUNNER CAPACITY (measured in the wild, 2026):
#   ubuntu-24.04: 4 vCPU / 16 GB RAM / /dev/root 72G (19-25G free)
#                 + /dev/sda1 74G on /mnt (66G free), 6 h job limit.
#   We free preinstalled toolchains, then put the ENTIRE source tree and out/
#   on /mnt. Use -j4 (4 vCPU) to stay within 16 GB RAM.
#
# 2026-11-09 FIXES (see y52s_twrp_final.html chapter 18):
#   1) ccache was 0.0/8.0 because TWRP-11 build/core/ccache.mk requires
#      CCACHE_EXEC -- USE_CCACHE alone is a no-op in Android 11. Set it plus
#      the documented cross-checkout cache settings, and fail fast if
#      get_build_var CC_WRAPPER is empty.
#   2) The device tree now carries the VERIFIED touch/HAL/USB payload and
#      the official vivo-signed vbmeta; a post-build step grafts that vbmeta
#      onto the compiled image (AOSP test key => km_error=-62, no decryption).
#   3) patches/twrp11/0001 fixes -26 (KEY_USER_NOT_AUTHENTICATED) for
#      vivo DOUBLE_APP user 999.
# ===========================================================================
name: Build TWRP 11 for vivo Y52s

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      # Only device-tree / patch changes need a rebuild. Workflow-only edits
      # must NOT auto-trigger another 30-60 min sync + 33 min compile.
      - 'device/vivo/y52s/**'
      - 'patches/twrp11/**'
      - 'build/ci_hybrid.py'

# A second manual run must not fight the previous one for the release.
concurrency:
  group: y52s-twrp-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    env:
      TWRP_WORK: /mnt/twrp
      MANIFEST: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git
      BRANCH: twrp-11
      DEVICE_PATH: device/vivo/y52s
      LUNCH_TARGET: omni_y52s-eng
      # --- ccache: CCACHE_EXEC is MANDATORY in Android 11 --------------------
      # build/core/ccache.mk: "So if you still want to use ccache, continue
      # setting USE_CCACHE, but also set the CCACHE_EXEC environment variable
      # to the path to your ccache executable." Without it CC_WRAPPER stays
      # empty and `ccache -s` reports 0.0/8.0 (measured on run 2026-11-09).
      USE_CCACHE: 1
      CCACHE_EXEC: /usr/bin/ccache
      # Export the wrappers as environment too: Android 11 builds most C++ via
      # soong, which reads CC_WRAPPER/CXX_WRAPPER from the environment. Without
      # them only the make-based parts would be cached.
      CC_WRAPPER: /usr/bin/ccache
      CXX_WRAPPER: /usr/bin/ccache
      CCACHE_DIR: /mnt/ccache
      CCACHE_MAXSIZE: 8G
      # Fresh `repo sync` every run changes mtimes; these are the values
      # ccache.mk itself recommends so a warm cache across runners still hits.
      CCACHE_COMPILERCHECK: content
      CCACHE_BASEDIR: /
      CCACHE_SLOPPINESS: time_macros,include_file_mtime,file_macro
      CCACHE_CPP2: 'true'

    steps:
      - name: Checkout this (small) repository
        uses: actions/checkout@v4

      - name: Show disk before cleanup
        run: df -h

      - name: Free disk + prepare /mnt
        run: |
          set -e
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo docker image prune --all --force || true
          sudo mkdir -p /mnt/twrp /mnt/ccache
          sudo chown -R "$USER" /mnt/twrp /mnt/ccache
          df -h
          echo "free on /mnt: $(df -h /mnt | tail -1)"

      # Only ccache fits in the 10 GB/repo cache budget. A warm cache turns the
      # ~33 min compile mostly into cache hits + relinking; repo sync still runs.
      - name: Restore ccache
        id: ccache-restore
        uses: actions/cache/restore@v4
        with:
          path: /mnt/ccache
          key: ${{ runner.os }}-twrp11-ccache-${{ hashFiles('device/vivo/y52s/**', 'patches/twrp11/**') }}
          restore-keys: |
            ${{ runner.os }}-twrp11-ccache-

      - name: JDK 11 (Android 11 baseline)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'

      - name: Build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev libncurses-dev libssl-dev libxml2-utils xsltproc \
            unzip fontconfig python3 python3-pip ccache bc rsync \
            libgl1-mesa-dev libx11-dev lib32z1-dev || true
          python3 --version
          java -version

      - name: Configure ccache (must be non-empty before the build)
        run: |
          set -e
          test -x "$CCACHE_EXEC"
          ccache -M "$CCACHE_MAXSIZE"
          ccache -o compression=true
          ccache -z
          ccache -s
          echo "CCACHE_EXEC=$CCACHE_EXEC  CCACHE_DIR=$CCACHE_DIR"

      - name: Install repo
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: repo init (twrp-11, depth=1)
        working-directory: /mnt/twrp
        run: |
          "$HOME/bin/repo" init --depth=1 -u "$MANIFEST" -b "$BRANCH"
          df -h /mnt

      - name: Install the y52s device tree
        run: |
          set -e
          mkdir -p "$TWRP_WORK/device/vivo"
          rm -rf "$TWRP_WORK/$DEVICE_PATH"
          cp -a "$GITHUB_WORKSPACE/$DEVICE_PATH" "$TWRP_WORK/$DEVICE_PATH"
          echo "--- crypto flags that MUST be present ---"
          grep -nE '^TW_INCLUDE_(CRYPTO|FBE) :=' \
            "$TWRP_WORK/$DEVICE_PATH/BoardConfig.mk"
          grep -q '^TW_INCLUDE_CRYPTO := true' "$TWRP_WORK/$DEVICE_PATH/BoardConfig.mk"
          grep -q '^TW_INCLUDE_FBE := true' "$TWRP_WORK/$DEVICE_PATH/BoardConfig.mk"
          echo "--- VERIFIED touch / HAL / firmware payload ---"
          test -f "$TWRP_WORK/$DEVICE_PATH/recovery/root/system/bin/vts_app_recovery"
          test -f "$TWRP_WORK/$DEVICE_PATH/recovery/root/vendor/bin/mcDriverDaemon"
          test -f "$TWRP_WORK/$DEVICE_PATH/recovery/root/vendor/bin/hw/android.hardware.keymaster@4.0-service.trustonic"
          test -f "$TWRP_WORK/$DEVICE_PATH/recovery/root/vendor/lib64/libMcClient.so"
          test -f "$TWRP_WORK/$DEVICE_PATH/recovery/root/vendor/lib64/libkeymaster4.so"
          test -f "$TWRP_WORK/$DEVICE_PATH/recovery/root/vendor/app/mcRegistry/020f0000000000000000000000000000.tlbin"
          test -f "$TWRP_WORK/$DEVICE_PATH/recovery/root/vendor/etc/vintf/manifest.xml"
          echo "touch firmware blobs: $(find "$TWRP_WORK/$DEVICE_PATH/recovery/root/vendor/firmware" -type f | wc -l)"
          echo "trustlet files: $(find "$TWRP_WORK/$DEVICE_PATH/recovery/root/vendor/app/mcRegistry" -type f | wc -l)"
          grep -q 'setenv LD_LIBRARY_PATH /system/lib64:/vendor/lib64:/vendor/lib64/hw' \
            "$TWRP_WORK/$DEVICE_PATH/recovery/root/init.recovery.mt6853.rc"
          echo "--- official vivo AVB assets ---"
          test -f "$TWRP_WORK/$DEVICE_PATH/avb/vbmeta_official.bin"
          test -f "$TWRP_WORK/$DEVICE_PATH/avb/footer_official.bin"
          grep -q 'y52s: configfs MTP switch' \
            "$TWRP_WORK/$DEVICE_PATH/recovery/root/init.recovery.mt6853.rc"
          ls -lh "$TWRP_WORK/$DEVICE_PATH/avb/"

      - name: repo sync
        working-directory: /mnt/twrp
        run: |
          "$HOME/bin/repo" sync -c -j4 --force-sync --no-clone-bundle --no-tags
          df -h /mnt
          du -sh /mnt/twrp

      - name: Assert product makefile needs no vendor/omni
        run: |
          set -e
          cd "$TWRP_WORK"
          if grep -nE '^[[:space:]]*\$\(call inherit-product,[[:space:]]*vendor/' \
               device/vivo/y52s/omni_y52s.mk; then
            echo "::error::product makefile still inherits vendor/* - lunch will fail"
            exit 1
          fi
          echo "OK: product makefile is self-contained (AOSP product config only)"

      # Source-level fixes are applied to the freshly synced tree. `git apply
      # --check` makes a branch drift fail loudly instead of silently building
      # an unpatched binary.
      - name: Apply y52s source patches
        run: |
          set -e
          cd "$TWRP_WORK/bootable/recovery"
          for p in "$GITHUB_WORKSPACE"/patches/twrp11/*.patch; do
            echo "--- $(basename "$p") ---"
            git apply --check --verbose "$p"
            git apply "$p"
          done
          echo "--- patch markers ---"
          grep -n 'Write_Owner_Auth_Token' crypto/fscrypt/Decrypt.cpp | head -3
          grep -q 'y52s: owner auth token written' crypto/fscrypt/Decrypt.cpp

      - name: Build recoveryimage
        working-directory: /mnt/twrp
        run: |
          set -e
          . build/envsetup.sh
          lunch "$LUNCH_TARGET"
          # Fail fast if ccache is not actually wired into the compiler command.
          WRAPPER="$(get_build_var CC_WRAPPER)"
          echo "CC_WRAPPER=[$WRAPPER]"
          if [ -z "$WRAPPER" ]; then
            echo "::error::CC_WRAPPER is empty -- USE_CCACHE/CCACHE_EXEC not honoured"
            exit 1
          fi
          ccache -z
          # DO NOT pipe through `tee /mnt/build.log`: /mnt itself is root-owned
          # (we only chown /mnt/twrp and /mnt/ccache). With pipefail that made
          # a SUCCESSFUL build exit 1 while /mnt/build.log never existed.
          # GitHub captures stdout directly -- no extra log file is needed.
          if type mka >/dev/null 2>&1; then
            mka recoveryimage -j4
          else
            echo "::warning::mka unavailable, falling back to make"
            make recoveryimage -j4
          fi
          echo "=== ccache after build ==="
          ccache -s
          df -h /mnt
          ls -lh "out/target/product/y52s/recovery.img"

      # The compiled image is signed with the AOSP test key. Graft the GENUINE
      # vivo-signed vbmeta/footer (1728 B + 64 B, checked into the device tree)
      # so the TEE sees boot.security_patch=2019-06-06 instead of 2099-12-31.
      - name: 'Post-build: official vivo AVB hybrid'
        run: |
          set -e
          python3 "$GITHUB_WORKSPACE/build/ci_hybrid.py" \
            "$TWRP_WORK/out/target/product/y52s/recovery.img"
          ls -lh "$TWRP_WORK/out/target/product/y52s/recovery.img"

      # restore/save split + always(): a build that fails downstream still
      # keeps its compiler cache for the next run. Duplicated keys are harmless.
      - name: Save ccache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: /mnt/ccache
          key: ${{ steps.ccache-restore.outputs.cache-primary-key }}

      - name: Verify the produced image
        continue-on-error: true
        run: |
          IMG="$TWRP_WORK/out/target/product/y52s/recovery.img"
          ls -lh "$IMG"
          sha256sum "$IMG"
          python3 - "$IMG" <<'PY'
          import sys, struct, hashlib
          p = sys.argv[1]
          b = open(p, 'rb').read()
          print('size:', len(b), 'magic:', b[:8])
          assert b[:8] == b'ANDROID!'
          v = struct.unpack_from('<10I', b, 8)
          print('header_version=%d page_size=%d kernel_size=%d ramdisk_size=%d os_version=0x%08x'
                % (v[8], v[7], v[0], v[2], v[9]))
          f = b[-64:]
          assert f[:4] == b'AVBf', 'official AVB footer missing'
          vbo = struct.unpack_from('>Q', f, 20)[0]
          vbs = struct.unpack_from('>Q', f, 28)[0]
          vb = b[vbo:vbo+vbs]
          assert vb[:4] == b'AVB0' and b'2019-06-06' in vb
          print('official vbmeta at 0x%x (%d B), boot_patchlevel 2019-06-06 present' % (vbo, vbs))
          print('SHA256', hashlib.sha256(b).hexdigest())
          PY

      # always(): never lose a successfully compiled image because an earlier
      # step reported a non-zero status (that is exactly what happened in run 2).
      - name: Upload recovery.img
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: y52s-twrp11-recovery
          path: |
            /mnt/twrp/out/target/product/y52s/recovery.img
            /mnt/twrp/out/target/product/y52s/recovery.img.sha256
            /mnt/twrp/out/target/product/y52s/recovery_ci_built.img
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6

      - name: Build summary
        if: always()
        run: |
          echo "### y52s TWRP 11 build" >> "$GITHUB_STEP_SUMMARY"
          echo "- manifest: \`$BRANCH\` (keystore2-free, matches Android 10 FBE)" >> "$GITHUB_STEP_SUMMARY"
          echo "- lunch: \`$LUNCH_TARGET\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- source patches: \`patches/twrp11/*.patch\` (user 999 owner auth token)" >> "$GITHUB_STEP_SUMMARY"
          echo "- AVB: official vivo-signed vbmeta/footer grafted post-build" >> "$GITHUB_STEP_SUMMARY"
          echo "- ccache (8G cap, 10 GB/repo cache limit):" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ccache -s >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          df -h /mnt >> "$GITHUB_STEP_SUMMARY"
