# ===========================================================================
# y52s - build the ONE-TIME user-999 credential recovery tool (a tiny dex).
#
# This is NOT a TWRP decryption bypass. In the unlocked Android system,
# AndroidKeyStore can open the auth-bound "profile_key_name_decrypt_999" key
# and decrypt /data/system/users/999/gatekeeper.profile.key, yielding the
# 80-char LSKF of user 999 (AOSP's tied-profile random password). TWRP cannot
# do that from recovery: every direct Keymaster 4.0 HIDL begin() returns -26.
#
# The tool writes P to /cache/recovery/u999_cred. TWRP's OWN
# Decrypt_User_Synth_Pass(999, P) then performs the real decryption. The dex
# is deleted afterwards; no data is copied or packed.
#
# Note: only standard java.* classes are used (KeyStore/Cipher/IO), so no
# android.jar is required to compile. d8 only needs the Android SDK's
# build-tools, which the ubuntu runner already has.
# ===========================================================================
name: Build user-999 credential recovery tool

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'flash/U999Cred.java'
      - '.github/workflows/build-u999-cred-tool.yml'

jobs:
  build-tool:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Compile U999Cred.java to classes.dex
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/classes out/dex
          javac -source 8 -target 8 -d out/classes flash/U999Cred.java
          test -f out/classes/U999Cred.class
          D8=$(ls "$ANDROID_HOME"/build-tools/*/d8 | sort -V | tail -1)
          echo "d8 = $D8"
          ANDROID_JAR=$(ls "$ANDROID_HOME"/platforms/*/android.jar | sort -V | tail -1)
          echo "android.jar = $ANDROID_JAR"
          "$D8" --min-api 29 --lib "$ANDROID_JAR" --output out/dex out/classes/U999Cred.class
          test -f out/dex/classes.dex
          (cd out/dex && zip -j ../u999.jar classes.dex)
          echo "--- jar ---"
          unzip -l out/u999.jar
          echo "--- dex strings (sanity) ---"
          strings out/dex/classes.dex | grep -E 'profile_key_name_decrypt_999|gatekeeper.profile.key|Y52S_CRED_OK' || true

      - name: Upload u999.jar
        uses: actions/upload-artifact@v4
        with:
          name: u999-cred-tool
          path: out/u999.jar
          if-no-files-found: error
